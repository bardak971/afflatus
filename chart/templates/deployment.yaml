apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "afflatus.name" . }}
  labels:
    {{- include "afflatus.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  # one pod at a time: the database is one writer, and a volume with ReadWriteOnce has one reader
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      {{- include "afflatus.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "afflatus.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: afflatus
          image: "{{ .Values.image.repository }}:{{ include "afflatus.tag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: {{ .Values.port | quote }}
            - name: DATA_DIR
              value: /data
            {{- if .Values.database.existingSecret }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.key }}
            {{- end }}
            {{- if .Values.ingress.enabled }}
            # the server answers only to the names it knows (hostCheck.ts): the Ingress's host is one of them,
            # and PUBLIC_URL is also the address ComfyUI fetches pictures and clips from
            - name: PUBLIC_URL
              value: {{ .Values.env.PUBLIC_URL | default (include "afflatus.ingressUrl" .) | quote }}
            - name: ALLOWED_HOSTS
              value: {{ compact (list .Values.ingress.host .Values.env.ALLOWED_HOSTS) | join "," | quote }}
            {{- end }}
            {{- range $key, $value := .Values.env }}
            {{- if not (and $.Values.ingress.enabled (has $key (list "PUBLIC_URL" "ALLOWED_HOSTS"))) }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            # the server's working copies for ffmpeg (trims, exports, the backup's database copy) go to /tmp:
            # a scratch volume of the pod's own, so the image's root can be read-only
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
              # the kubelet calls the pod by its IP, a name the server refuses (hostCheck.ts): it says localhost
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
              # the kubelet calls the pod by its IP, a name the server refuses (hostCheck.ts): it says localhost
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "afflatus.name" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
