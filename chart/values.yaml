# Afflatus on Kubernetes: one pod, its data on a volume. ComfyUI is not part of this: it runs where the GPU is,
# and Afflatus is given its address in Settings once it is up (the setting lives in the data volume).

image:
  repository: ghcr.io/bardak971/afflatus
  # empty: the chart's appVersion, the release this chart came with
  tag: ""
  pullPolicy: IfNotPresent

# Pull secrets, for an image kept in a private registry.
imagePullSecrets: []
#  - name: registry-pull

# One, always (0 to stop it): SQLite in the volume is one writer, and the queue is one worker for one ComfyUI. The
# chart refuses more.
replicas: 1

port: 8720

# Everything Afflatus keeps: the database, the library's files, the settings.
persistence:
  enabled: true
  size: 50Gi
  # empty: the cluster's default storage class
  storageClassName: ""
  accessModes: [ReadWriteOnce]
  # An existing claim instead of one made by the chart.
  existingClaim: ""

# Postgres instead of SQLite, when wanted: a secret holding DATABASE_URL (postgres://…). SQLite is the
# supported one; Postgres is written and not yet exercised. The files stay on the volume either way.
database:
  existingSecret: ""
  key: DATABASE_URL

# Plain environment for the container (TZ, FFMPEG, LINK_ROOTS… ; HOST, PORT and DATA_DIR are set by the chart).
# The server answers only to the names it knows: reached through a gateway or a routes app rather than the
# chart's Ingress, name that host in ALLOWED_HOSTS (comma-separated) and set PUBLIC_URL to its address. With
# the Ingress on, the chart sets both from ingress.host; an ALLOWED_HOSTS given here is added to it.
env: {}
# Secrets and config maps whole, as environment.
envFrom: []

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 2Gi

# The container runs as the image's node user; the volume is made writable for it.
securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  runAsNonRoot: true

# The container itself: no way up to more privilege, no capabilities, the runtime's seccomp profile, and the
# image's root read-only. The server writes to /data and to /tmp (a scratch volume the chart mounts), and to
# the ComfyUI folder only when one is given in Settings (then mount that folder writable).
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  seccompProfile:
    type: RuntimeDefault
  readOnlyRootFilesystem: true

service:
  type: ClusterIP

# An Ingress, for clusters that route that way. Left off where a gateway or a central routes app does it
# (then route to the service `<release>-afflatus` on `port`, and see env above). When on, the chart sets
# PUBLIC_URL to https://<host> (http without tls) and adds the host to ALLOWED_HOSTS.
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: afflatus.example.com
  tls: []
  #  - secretName: afflatus-tls
  #    hosts: [afflatus.example.com]

# Prometheus: Afflatus serves /metrics on its port (render times, queue). A PodMonitor for kube-prometheus-stack.
metrics:
  enabled: false
  interval: 30s
  # The label the cluster's Prometheus selects monitors by.
  labels:
    release: kube-prometheus-stack

nodeSelector: {}
tolerations: []
affinity: {}
