name: Feature request
description: An idea for Afflatus.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The task, and where Afflatus gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: How you picture it. A sketch or a ComfyUI workflow that does it helps.
  - type: textarea
    id: else
    attributes:
      label: Anything else
