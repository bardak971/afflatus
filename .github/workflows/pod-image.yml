# The Afflatus pod image (deploy/runpod): ComfyUI, its Manager and the node pack, for a GPU deployed from Afflatus.
# It is the thin top (the node pack, the pod's scripts, Manager's registry list) on the base its Dockerfile pins by digest
# (pod-base-image.yml): a few MB per tag, built in a couple of minutes.
# On a pod-v* tag it is pushed to GHCR in two builds of the same PyTorch: for CUDA 13.0 (pod-v0.1.2 →
# ghcr.io/<owner>/afflatus-pod:0.1.2) and 12.8 (…:0.1.2-cu128); from the Actions tab they are built only, as a dry run. Its own tags, apart from the app's v*: the image changes with ComfyUI and the node pack, not
# with every release of Afflatus. The version Afflatus deploys is the one it names (apps/server/src/runpod.ts POD_IMAGE).
#
# The first push makes the package private on GitHub: set it public once (the package's settings, Change visibility),
# or RunPod cannot pull it.
#
# Actions are pinned to commit SHAs, as in release.yml.
name: Pod image

on:
  push:
    tags: ["pod-v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/afflatus-pod
  PUBLISH: ${{ github.event_name == 'push' }}

jobs:
  # what the image ships, tested first: the node pack (its lock, watchdog and frame arithmetic) and the pod's own scripts
  # (the boot log, broken.py, died.py, Manager's registry list, start.sh's failure path and its run of ComfyUI). Every pod deployed from a broken image
  # bills its boot for nothing
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 -m py_compile comfy-nodes/afflatus-nodes/*.py deploy/runpod/*.py
      - run: |
          python3 -m venv "$RUNNER_TEMP/pack-tests"
          "$RUNNER_TEMP/pack-tests/bin/pip" install -q "pytest==9.1.1" "numpy==2.5.4"
          "$RUNNER_TEMP/pack-tests/bin/python" -m pytest -q comfy-nodes/afflatus-nodes/tests
      - run: python3 -m unittest discover -s deploy/runpod/tests
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
      - run: shellcheck deploy/runpod/start.sh

  image:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cuda: cu130, suffix: "" }
          - { cuda: cu128, suffix: "-cu128" }
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # the job can write packages: its token is not left in the checkout
          persist-credentials: false
      - name: Check the version
        id: version
        env:
          REF: ${{ github.ref_name }}
        run: |
          if [ "$PUBLISH" != "true" ]; then echo "tag=dry" >> "$GITHUB_OUTPUT"; exit 0; fi
          v="${REF#pod-v}"
          if ! printf '%s' "$v" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'; then echo "A pod tag is pod-v1.2.3, not $REF" >&2; exit 1; fi
          echo "tag=$v" >> "$GITHUB_OUTPUT"
      # the base's torch and CUDA libraries take several GB once pulled: the runner's preinstalled toolchains make the room
      - name: Make room
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # the base the top is built on was built from base/Dockerfile as this commit has it, for this CUDA: a change to that
      # file with no new base (or a digest of another build pasted in) would ship a pod that is not its code
      - name: Check the base is this commit's
        env:
          CUDA: ${{ matrix.cuda }}
        run: |
          var="BASE_$(printf '%s' "$CUDA" | tr '[:lower:]' '[:upper:]')"
          base=$(sed -n "s/^ARG $var=//p" deploy/runpod/Dockerfile | tr -d '\r')
          if ! printf '%s' "$base" | grep -Eq '@sha256:[0-9a-f]{64}$'; then echo "::error::deploy/runpod/Dockerfile's $var is not pinned by digest: $base"; exit 1; fi
          want=$(tr -d '\r' < deploy/runpod/base/Dockerfile | sha256sum | cut -d' ' -f1)
          labels=$(docker buildx imagetools inspect "$base" --format '{{json .Image.Config.Labels}}')
          got=$(printf '%s' "$labels" | jq -r '."afflatus.base-dockerfile-sha256" // ""')
          cuda=$(printf '%s' "$labels" | jq -r '."afflatus.cuda" // ""')
          echo "$base: $labels"
          if [ "$got" != "$want" ]; then echo "::error::$base was built from another base/Dockerfile ($got, this commit's is $want): tag a pod-base-v* and pin its digests"; exit 1; fi
          if [ "$cuda" != "$CUDA" ]; then echo "::error::$base is the $cuda build, not $CUDA"; exit 1; fi
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/runpod/Dockerfile
          # RunPod's GPUs are on x86 hosts
          platforms: linux/amd64
          # an OCI manifest: the base's layers are zstd (pod-base-image.yml), which only OCI's media types name; they are
          # copied as they are, the top's own few MB in gzip
          outputs: type=image,push=${{ env.PUBLISH == 'true' }},oci-mediatypes=true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}${{ matrix.suffix }}
          # a published image must carry Manager's registry list (registry_cache.py --required); a dry run goes on without it
          build-args: |
            TORCH_CUDA=${{ matrix.cuda }}
            REGISTRY_REQUIRED=${{ env.PUBLISH == 'true' && '1' || '' }}
          provenance: false
