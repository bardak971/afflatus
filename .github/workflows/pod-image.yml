# The Afflatus pod image (deploy/runpod): ComfyUI, its Manager and the node pack, for a GPU deployed from Afflatus.
# On a pod-v* tag it is pushed to GHCR in two builds of the same PyTorch: for CUDA 13.0 (pod-v0.1.2 →
# ghcr.io/<owner>/afflatus-pod:0.1.2) and 12.8 (…:0.1.2-cu128); from the Actions tab they are built only, as a dry run. Its own tags, apart from the app's v*: the image changes with ComfyUI and the node pack, not
# with every release of Afflatus. The version Afflatus deploys is the one it names (apps/server/src/runpod.ts POD_IMAGE).
#
# The first push makes the package private on GitHub: set it public once (the package's settings, Change visibility),
# or RunPod cannot pull it.
#
# Actions are pinned to commit SHAs, as in release.yml.
name: Pod image

on:
  push:
    tags: ["pod-v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/afflatus-pod
  PUBLISH: ${{ github.event_name == 'push' }}

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cuda: cu130, suffix: "" }
          - { cuda: cu128, suffix: "-cu128" }
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check the version
        id: version
        env:
          REF: ${{ github.ref_name }}
        run: |
          if [ "$PUBLISH" != "true" ]; then echo "tag=dry" >> "$GITHUB_OUTPUT"; exit 0; fi
          v="${REF#pod-v}"
          if ! printf '%s' "$v" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'; then echo "A pod tag is pod-v1.2.3, not $REF" >&2; exit 1; fi
          echo "tag=$v" >> "$GITHUB_OUTPUT"
      # torch's CUDA wheels and their libraries take several GB: the runner's preinstalled toolchains make the room
      - name: Make room
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/runpod/Dockerfile
          # RunPod's GPUs are on x86 hosts
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}${{ matrix.suffix }}
          build-args: |
            TORCH_CUDA=${{ matrix.cuda }}
          provenance: false
