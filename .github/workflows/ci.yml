# On every push and pull request: the types and the tests, and that the release stage builds. release.yml runs it too
# (workflow_call) before it publishes anything: a v* tag is not built here, so a tag on a commit that failed a check
# would otherwise ship.
name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_call:

# the checks only read the repository
permissions:
  contents: read

jobs:
  check:
    # ubuntu-24.04, not -latest: its apt ffmpeg (6.1.1) passes the start-up check; a newer image's (7.1) is refused and miscounts run-ups
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: pnpm }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg shellcheck
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # the hooks rules and a few rules for outright mistakes (.oxlintrc.json); a disable comment says why
      - run: pnpm lint
      # no two modules that import each other's values (scripts/check-cycles.ts: madge, pinned, through npx)
      - run: pnpm check:cycles
      # nothing exported that nothing uses (knip.json), and nothing the app exports that only tests use (a test hook says so
      # with @internal; the scripts count as the app): package.json's check:knip, the same two runs as locally. Knip is run
      # pinned through npx, not a dependency of the app
      - run: pnpm check:knip
      - run: pnpm test
      # every recipe's every variant built and checked against the saved ComfyUI node catalog, with the graph that loads
      # its models ahead (no GPU, no ComfyUI)
      - run: pnpm check:graphs
      # the node pack: every file compiles, and its frame and token arithmetic holds (on stand-ins for torch and ComfyUI)
      - run: python3 -m py_compile comfy-nodes/afflatus-nodes/*.py
      # with numpy, which ComfyUI has, so that the Face Match tests run (they are skipped without it)
      - run: |
          python3 -m venv "$RUNNER_TEMP/pack-tests"
          "$RUNNER_TEMP/pack-tests/bin/pip" install -q "pytest==9.1.1" "numpy==2.5.4"
          "$RUNNER_TEMP/pack-tests/bin/python" -m pytest -q comfy-nodes/afflatus-nodes/tests
      # the pod image's boot log (deploy/runpod/bootlog.py): its server answers only with the pod's token
      - run: python3 -m unittest discover -s deploy/runpod/tests
      # the pod's start decides what a failed boot costs (its failure path hands over to broken.py): POSIX sh, checked
      - run: shellcheck deploy/runpod/start.sh
      - run: node scripts/release/stage.mjs

  # the timeline player frame by frame in headless Chrome (the runner has Chrome): H3-shaped synthetic clips with their frame
  # index burned in, played in the real editor; fails on a frame out of order, a flicker at a hand-over, a hidden run-up shown
  player:
    # ubuntu-24.04, not -latest: its apt ffmpeg (6.1.1) passes the start-up check; a newer image's (7.1) is refused and miscounts run-ups
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: pnpm }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:player

  # the migrations on a real Postgres (DATABASE_URL is documented): the rest of the tests run on SQLite
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: afflatus
          POSTGRES_PASSWORD: afflatus
          POSTGRES_DB: afflatus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U afflatus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://afflatus:afflatus@localhost:5432/afflatus
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run apps/server/test/postgres.test.ts
