# A release on every tag v*: the tests, the image on GHCR (amd64 and arm64, tagged like the tag), the bundles
# for Windows, Linux and macOS, and a GitHub release that carries them with generated notes.
#
# Every action is pinned to a commit SHA, with the tag it stood for as a comment beside it
# (`uses: owner/action@<sha> # vN`). To move one, read the new SHA off the action's release page on GitHub
# and change both; a bare tag can be moved by its owner, a SHA cannot.
name: Release

on:
  push:
    tags: ["v*"]

# nothing writes by default: the jobs that publish ask for what they publish
permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/afflatus

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: pnpm }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  image:
    needs: test
    runs-on: ubuntu-latest
    # pushes the image to GHCR
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: AFFLATUS_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # no provenance artifact: the release takes the bundles only
          provenance: false

  bundles:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: win-x64 }
          - { os: ubuntu-latest, platform: linux-x64 }
          - { os: macos-latest, platform: darwin-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node scripts/release/stage.mjs
        env: { AFFLATUS_VERSION: "${{ github.ref_name }}" }
      - run: node scripts/release/bundle.mjs --platform ${{ matrix.platform }} --version ${{ github.ref_name }}
        # the GitHub API that lists the ffmpeg release's files is rate-limited without a token
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundle-${{ matrix.platform }}
          path: release/dist/*
          if-no-files-found: error

  release:
    needs: [image, bundles]
    runs-on: ubuntu-latest
    # creates the GitHub release and uploads the bundles to it
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { path: dist, pattern: "bundle-*", merge-multiple: true }
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes header
        run: |
          cat > notes.md <<EOF
          ## Run it

          **Windows**: unzip \`afflatus-${{ github.ref_name }}-win-x64.zip\`, double-click \`Afflatus.bat\`.
          **Linux**: \`tar xzf afflatus-${{ github.ref_name }}-linux-x64.tar.gz && ./afflatus-${{ github.ref_name }}-linux-x64/afflatus.sh\`
          **macOS (Apple Silicon)**: \`tar xzf afflatus-${{ github.ref_name }}-darwin-arm64.tar.gz && ./afflatus-${{ github.ref_name }}-darwin-arm64/afflatus.sh\` (needs \`brew install ffmpeg\`)
          **Docker**: \`docker run -p 8720:8720 -v afflatus-data:/data ${{ env.IMAGE }}:${{ github.ref_name }}\`

          Image: \`${{ env.IMAGE }}:${{ github.ref_name }}\` (also \`:latest\`), linux/amd64 and linux/arm64.
          Then open http://127.0.0.1:8720 and, in Settings, give it the address of your ComfyUI.

          ## What changed
          EOF
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Afflatus ${{ github.ref_name }}
          body_path: notes.md
          generate_release_notes: true
          append_body: true
          files: |
            dist/*
