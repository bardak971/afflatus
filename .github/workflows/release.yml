# A release on every tag v*: the tests, the image on GHCR (amd64 and arm64, tagged like the tag), the bundles
# for Windows, Linux and macOS, and a GitHub release that carries them with generated notes. A tag with a "-"
# (v0.3.0-rc.1) is a pre-release: its GitHub release is marked so, and the image does not move `latest`.
#
# The npm tree is resolved once, in the stage job: its package-lock.json goes to the image and to every
# bundle, so all of them install the same packages.
#
# The version reaches the scripts through the environment ($VERSION), never spelled into a shell line; the
# stage job and bundle.mjs refuse anything but v1.2.3 or v1.2.3-rc.1.
#
# The release's SHA256SUMS.txt is signed (SHA256SUMS.txt.sig, scripts/release/sign.mjs) with the Ed25519 key in
# the secret AFFLATUS_RELEASE_KEY, whose public half the app holds (apps/server/src/releaseKey.ts): an Afflatus
# updating itself takes only what that signature vouches for. A tag pushed without the secret fails at once.
#
# Every action is pinned to a commit SHA, with the tag it stood for as a comment beside it
# (`uses: owner/action@<sha> # vN`). To move one, read the new SHA off the action's release page on GitHub
# and change both; a bare tag can be moved by its owner, a SHA cannot.
name: Release

on:
  push:
    tags: ["v*"]
  # a dry run from the Actions tab: the tests, the image built (not pushed) and the three bundles (as the run's
  # artifacts, to download and try), and no release
  workflow_dispatch:
    inputs:
      version:
        description: "Version written into the bundles"
        default: "v0.0.0-dry"
        required: false

# nothing writes by default: the jobs that publish ask for what they publish
permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/afflatus
  VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  PUBLISH: ${{ github.event_name == 'push' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: pnpm }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  # the release staged once, for the package-lock.json it resolves: the image and the bundles install that one
  stage:
    runs-on: ubuntu-latest
    steps:
      - name: Check the version
        run: |
          if ! printf '%s' "$VERSION" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9_.]+)?'; then
            echo "::error::the version is not a release tag (v1.2.3 or v1.2.3-rc.1)"
            exit 1
          fi
      # before anything is built: a release that cannot be signed is not made
      - name: Check the release key
        if: env.PUBLISH == 'true'
        env: { AFFLATUS_RELEASE_KEY: "${{ secrets.AFFLATUS_RELEASE_KEY }}" }
        run: |
          if [ -z "$AFFLATUS_RELEASE_KEY" ]; then
            echo "::error::the secret AFFLATUS_RELEASE_KEY (the release key, an Ed25519 PKCS#8 PEM) is not set: the release cannot be signed"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node scripts/release/stage.mjs
        env: { AFFLATUS_VERSION: "${{ env.VERSION }}" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staged-lock
          path: release/app/package-lock.json
          if-no-files-found: error

  image:
    needs: [test, stage]
    runs-on: ubuntu-latest
    # pushes the image to GHCR
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # the staged package-lock.json, inside the build context: the Dockerfile's stage takes it (AFFLATUS_LOCK)
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: staged-lock, path: staged }
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          # a pre-release tag gets its own version tag only: no major.minor, no latest
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=sha
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            AFFLATUS_VERSION=${{ env.VERSION }}
            AFFLATUS_LOCK=staged/package-lock.json
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # no provenance artifact: the release takes the bundles only
          provenance: false

  bundles:
    needs: [test, stage]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: win-x64 }
          - { os: ubuntu-latest, platform: linux-x64 }
          - { os: macos-latest, platform: darwin-arm64 }
    runs-on: ${{ matrix.os }}
    # bash on every runner, Windows included, so that each step reads $VERSION the same way
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: staged-lock, path: staged }
      - run: node scripts/release/stage.mjs --lock staged/package-lock.json
        env: { AFFLATUS_VERSION: "${{ env.VERSION }}" }
      - run: node scripts/release/bundle.mjs --platform "$PLATFORM" --version "$VERSION"
        env:
          PLATFORM: ${{ matrix.platform }}
          # the GitHub API that lists the ffmpeg release's files is rate-limited without a token
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundle-${{ matrix.platform }}
          path: release/dist/*
          if-no-files-found: error

  release:
    needs: [image, bundles]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # creates the GitHub release and uploads the bundles to it
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { path: dist, pattern: "bundle-*", merge-multiple: true }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24 }
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Sign the checksums
        env: { AFFLATUS_RELEASE_KEY: "${{ secrets.AFFLATUS_RELEASE_KEY }}" }
        run: |
          if [ -z "$AFFLATUS_RELEASE_KEY" ]; then
            echo "::error::the secret AFFLATUS_RELEASE_KEY is not set: the release cannot be signed"
            exit 1
          fi
          node scripts/release/sign.mjs dist/SHA256SUMS.txt
          # checked with the public key the app holds: a secret that is not its private half stops the release here,
          # rather than shipping a signature no Afflatus accepts
          node scripts/release/sign.mjs dist/SHA256SUMS.txt --verify "$(sed -n 's/.*RELEASE_KEY = "\(.*\)".*/\1/p' apps/server/src/releaseKey.ts)"
      - name: Release notes header
        run: |
          # the image is tagged by the version without its "v" (metadata-action's semver tag)
          TAG="${VERSION#v}"
          case "$VERSION" in *-*) ALSO="" ;; *) ALSO=' (also `:latest`)' ;; esac
          cat > notes.md <<EOF
          ## Run it

          **Windows**: unzip \`afflatus-${VERSION}-win-x64.zip\`, double-click \`Afflatus\\Afflatus.bat\`.
          **Linux**: \`tar xzf afflatus-${VERSION}-linux-x64.tar.gz && ./Afflatus/afflatus.sh\`
          **macOS (Apple Silicon)**: \`tar xzf afflatus-${VERSION}-darwin-arm64.tar.gz && ./Afflatus/afflatus.sh\` (needs \`brew install ffmpeg\`)
          **Docker**: \`docker run -p 127.0.0.1:8720:8720 -v afflatus-data:/data ${IMAGE}:${TAG}\`

          Image: \`${IMAGE}:${TAG}\`${ALSO}, linux/amd64 and linux/arm64.
          Then open http://127.0.0.1:8720 and, in Settings, give it the address of your ComfyUI.

          ## Updating

          From 0.4.0 on, the Windows, Linux and macOS downloads update themselves: Settings > About says when a release is out and installs it, keeping the one before to go back to. Docker: pull the new image.
          **From 0.3.0**: unpack this release beside the 0.3.0 folder (not into it) and start it: it offers to bring your library over.

          \`SHA256SUMS.txt.sig\` is the Ed25519 signature of \`SHA256SUMS.txt\`, by the key whose public half is in \`apps/server/src/releaseKey.ts\`.

          ## What changed
          EOF
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Afflatus ${{ github.ref_name }}
          body_path: notes.md
          generate_release_notes: true
          append_body: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*
