<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Afflatus</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23151821'/%3E%3Cpath d='M32 10l4.6 13.4L50 28l-13.4 4.6L32 46l-4.6-13.4L14 28l13.4-4.6z' fill='%23f2c14e'/%3E%3Ccircle cx='47' cy='47' r='5' fill='%23f2c14e' opacity='.85'/%3E%3C/svg%3E" />
    <script>
      // what this browser kept under the app's earlier name is carried over once (the theme's own id too)
      try {
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k && k.indexOf("studai.") === 0 && localStorage.getItem("afflatus." + k.slice(7)) === null) {
            localStorage.setItem("afflatus." + k.slice(7), localStorage.getItem(k).split('"studai"').join('"afflatus"'));
          }
        }
      } catch (e) {}
      // the theme's own colours before the app has loaded, so that the page does not flash dark then light
      try {
        var p = JSON.parse(localStorage.getItem("afflatus.theme.paint") || "null");
        if (p) {
          document.documentElement.style.background = p.ground;
          document.documentElement.style.color = p.ink;
          document.querySelector('meta[name="color-scheme"]').setAttribute("content", p.light ? "light" : "dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
